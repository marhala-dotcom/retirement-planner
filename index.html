<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Horizon — a private, visual UK retirement planner for couples: pensions, ISAs, tax, State Pension and Monte Carlo market simulations. Runs entirely in your browser." />
    <meta name="theme-color" content="#2a78d6" />
    <title>Horizon · UK retirement planner</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('horizon-ui.v1') || '{}').theme
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
